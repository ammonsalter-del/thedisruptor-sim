<script>

const NUDGE_BTN={x:300,y:748,w:92,h:34};

const cv=document.getElementById('C'), cx=cv.getContext('2d');
let S=1, ox=0, oy=0;

function mkBall(x,y,vx,vy,on){
    return{x,y,vx,vy,on:!!on,trail:[]};

function resize(){
    const vw=innerWidth, vh=innerHeight, ar=PW/PH;
    let w,h;
    if(vw/vh<ar){w=vw;h=vw/ar}else{h=vh;w=vh*ar}
    const dpr=devicePixelRatio||1;
    cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
    cv.style.width=Math.round(w)+'px'; cv.style.height=Math.round(h)+'px';
    S=cv.width/PW;
    ox=(vw-w)/2; oy=(vh-h)/2;
    cv.style.marginLeft=Math.round(ox)+'px'; cv.style.marginTop=Math.round(oy)+'px';

}

// ═══════════════════════════════════════════════════════════════════
//  AUDIO
// ═══════════════════════════════════════════════════════════════════
let ac=null, mg=null;
function initA(){if(ac)return;try{ac=new(AudioContext||webkitAudioContext)();mg=ac.createGain();mg.gain.value=0.3;mg.connect(ac.destination)}catch(e){}}
function resumeA(){try{if(ac&&ac.state==='suspended')ac.resume()}catch(e){}}
function osc(type,f0,f1,dur,vol){
    if(!ac)return;try{const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t);
    if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(mg);o.start(t);o.stop(t+dur+.01)}catch(e){}
}
function noise(dur,vol,lo,hi){
    if(!ac)return;try{const t=ac.currentTime,n=ac.sampleRate*dur|0,
    buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const s=ac.createBufferSource();s.buffer=buf;
    const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=(lo+hi)/2;bp.Q.value=1.5;
    const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    s.connect(bp).connect(g).connect(mg);s.start(t);s.stop(t+dur+.01)}catch(e){}
}
const SFX={
    flipper(){osc('square',220,280,.04,.3);noise(.015,.2,800,3000)},
    bump1(){osc('sine',500,100,.12,.35);noise(.03,.18,600,4000)},
    bump2(){osc('sine',600,120,.1,.35);noise(.03,.18,800,3500)},
    bump3(){osc('sine',400,80,.14,.35);noise(.03,.18,500,4500)},
    sling(){osc('triangle',500,120,.05,.28);noise(.02,.12,1000,3000)},
    roll(){osc('sine',1200,800,.06,.15);osc('triangle',600,300,.04,.08)},
    drain(){osc('sine',400,50,.5,.3);osc('sawtooth',200,40,.4,.15)},
    launch(){osc('sawtooth',80,900,.25,.35);noise(.1,.3,200,1500)},
    tilt(){osc('square',90,90,.35,.45);noise(.15,.3,100,500)},
    tiltWarn(){osc('square',180,180,.08,.25)},
    knocker(){noise(.04,.55,800,2500);osc('sine',120,120,.07,.45)},
    target(){osc('sine',800,400,.08,.25);osc('triangle',1200,600,.06,.12)},
    dropAll(){osc('sine',440,880,.15,.3);osc('sine',660,1320,.15,.2);noise(.06,.2,1000,5000)},
    rampEnter(){osc('sine',300,600,.12,.2);osc('triangle',450,900,.1,.12)},
    rampExit(){osc('sine',600,300,.08,.15)},
    wallHit(){noise(.02,.08,500,2000)},
    spinner(){osc('sine',900,1200,.03,.15);osc('sine',1200,900,.03,.1)},
    phaseUp(){if(!ac)return;try{const t=ac.currentTime;
        [523,659,784].forEach((f,i)=>{
            const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;
            const s=t+i*.1;g.gain.setValueAtTime(.25,s);g.gain.exponentialRampToValueAtTime(.001,s+.2);
            o.connect(g).connect(mg);o.start(s);o.stop(s+.21)})}catch(e){}},
    sprintComplete(){if(!ac)return;try{const t=ac.currentTime;
        [523,659,784,1047].forEach((f,i)=>{
            const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;
            const s=t+i*.12;g.gain.setValueAtTime(.3,s);g.gain.exponentialRampToValueAtTime(.001,s+.3);
            o.connect(g).connect(mg);o.start(s);o.stop(s+.31)});
        noise(.08,.3,800,3000)}catch(e){}},
    innovation(){if(!ac)return;try{const t=ac.currentTime;
        [392,523,659,784,988,1175].forEach((f,i)=>{
            const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;
            const s=t+i*.1;g.gain.setValueAtTime(.22,s);g.gain.exponentialRampToValueAtTime(.001,s+.35);
            o.connect(g).connect(mg);o.start(s);o.stop(s+.36)});
        noise(.06,.15,1000,4500)}catch(e){}},
};

// ═══════════════════════════════════════════════════════════════
// SLINGSHOTS — based on real Eight Ball Deluxe photo reference
//
// In a real pinball machine, looking from above (player's POV):
//
//         OUTER WALL              OUTER WALL
//           |                        |
//           |  outlane gap           |  outlane gap
//           |                        |
//           |  INLANE    SLING  SLING    INLANE  |
//           |  channel   face    face   channel  |
//           |     \       |      |       /       |
//           |      \      |      |      /        |
//            \      \     |      |     /      /
//             \      FLIPPER    FLIPPER      /
//              \         \      /           /
//               \         DRAIN            /
//
// The sling is a triangular kicker BETWEEN the flippers and the
// inlane. Its angled face runs from the open playfield (~y=600)
// down toward the flipper pivot (~y=690). The ball rides down the
// OUTSIDE of the sling (the inlane) to reach the flipper.
//
// The sling kicks the ball when hit on its INNER face (from centre).
//
// Left sling: angled from (128,600) down to (120,690)
//   Inner vertical edge at x=128 (faces centre)
//   Kick direction: UP and RIGHT (back into play)
// Right sling: mirror at (248,600) to (256,690)
// ═══════════════════════════════════════════════════════════════
const slings=[
    // Left: aligned to keep a clean inlane and avoid choking the channel
    // The face (x1→x2) is the angled surface; x2→x3 is the bottom; x3→x1 is the inner vertical
    {x1:130,y1:602, x2:120,y2:690, x3:130,y3:690, nx:7,ny:-6, cd:0,fl:0},

];

// ═══════════════════════════════════════════════════════════════════
//  WALLS — clean lower playfield, NO trapping pockets
// ═══════════════════════════════════════════════════════════════════
const W=[
    // ═══════════════════════════════════════════════════════════════
    // LOWER PLAYFIELD — Eight Ball Deluxe reference
    //
    // Cross-section at any Y level in lower playfield (left side):
    //
    //   outer wall │ OUTLANE │ wall │  INLANE  │ SLING │ centre
    //              │  drain  │ post │ to flipper│ face  │
    //
    // The outer wall curves inward. Near y=590 there's an OUTLANE
    // GAP — a 16px break in the outer wall. Ball that enters drains.
    // Below the gap, the outer wall continues as the inlane boundary,
    // running parallel to the sling face, opening at the flipper.
    //
    // IMPORTANT: The inlane MUST have a clear exit into the flipper.
    // The outer wall ends near the flipper pivot — it does NOT connect
    // to the sling. The ~40px channel between outer wall and sling
    // opens directly onto the flipper.
    // ═══════════════════════════════════════════════════════════════

    // ─── LEFT OUTER WALL (upper portion) ───
    [38,100, 38,450, .35],
    [38,450, 42,530, .3],
    [42,530, 52,570, .3],

function allActiveBalls(){
    const out=[];
    if(G.ball&&G.ball.on)out.push(G.ball);
    for(const mb of G.multiBalls){if(mb.on)out.push(mb)}
    return out;
}

function startMultiBall(){
    if(G.multiBall.active||G.phase!=='play')return;
    const src=(G.ball&&G.ball.on)?G.ball:{x:195,y:620,vx:0,vy:-8};
    G.multiBalls=[
        mkBall(src.x-12,src.y-8,src.vx-2.8,Math.min(-5,src.vy-1.8),true),
        mkBall(src.x+12,src.y-8,src.vx+2.8,Math.min(-5,src.vy-1.8),true),
    ];
    G.multiBall.active=true;
    G.multiBall.time=22*60;
    G.multiBall.flash=180;G.multiBall.beat=0;G.multiBall.step=0;
    call(200,350,'MULTIBALL!', '#ffd54f',1);
    addSc(2500);
    G.bonus+=5*60;
    SFX.knocker();SFX.sprintComplete();
    for(let i=0;i<24;i++)spark(110+Math.random()*180,320+Math.random()*60,'#ffd54f',4);
}

function clearMultiBall(){
    G.multiBalls=[];
    G.multiBall.active=false;
    G.multiBall.time=0;G.multiBall.beat=0;G.multiBall.step=0;
}

function markRampMade(idx){
    if(G.rampsMade[idx])return;
    G.rampsMade[idx]=true;
    G.rampCount++;
    call(200,86,'RAMP '+G.rampCount+'/5','#ffd54f');
    if(G.rampCount>=5){
        call(200,110,'ALL 5 RAMPS UNLOCKED!', '#ffd54f',1);
        startMultiBall();
        G.rampsMade=[false,false,false,false,false];
        G.rampCount=0;
    }
}

function playMultiBeat(){
    if(!ac)return;
    const seq=[392,523,659,784,659,523,440,587];
    const f=seq[G.multiBall.step%seq.length];
    G.multiBall.step++;
    osc('square',f,f*1.03,0.05,0.11);
    osc('triangle',f/2,f/2,0.08,0.06);
    if((G.multiBall.step%2)===0)noise(.015,.05,1800,5000);
}

function advanceDT(phaseIdx,amount){
    if(G.tilt.on)return;
    if(phaseIdx<0||phaseIdx>4)return;
    const isComplete=G.dtComplete[phaseIdx];
    const ph=DT_PHASES[phaseIdx];

    if(!isComplete){
        G.dtProgress[phaseIdx]=Math.min(1,G.dtProgress[phaseIdx]+amount);
        if(G.dtProgress[phaseIdx]>=1){
            // Phase complete!
            G.dtComplete[phaseIdx]=true;
            G.phaseFl=80;
            G.lastPhase=phaseIdx;
            SFX.phaseUp();
            call(200,280,ph.icon+' '+ph.label+' DONE!',ph.col,1);
            addSc(500);
            for(let i=0;i<16;i++)spark(120+Math.random()*160,270+Math.random()*40,ph.col,3);
            shake(5);

            // Check: are ALL 5 done?
            const allDone=G.dtComplete.every(Boolean);
            if(allDone){
                completeSprint();
            }else{
                // Show how many remain
                const left=G.dtComplete.filter(v=>!v).length;
                setTimeout(()=>{
                    call(200,320,left+' phase'+(left>1?'s':'')+' remaining!','#333');
                },600);
            }
        }
    }else{
        // Iterating on completed phase — smaller bonus
        addSc(50);
    }
}

function completeSprint(){
    G.sprints++;
    G.sprintFl=240; // longer celebration
    G.best.s=Math.max(G.best.s,G.sprints);
    const inno=G.currentInno;
    G.innovations.push(inno);
    G.shippedInno=inno; // save for render
    const bonus=1000+G.sprints*500;
    addSc(bonus);
    SFX.sprintComplete();
    SFX.innovation();
    G.innovationDrop={on:true,y:92,vy:-1.5,text:inno,landed:false,t:210};
    // Massive particle explosion — fireworks
    for(let w=0;w<5;w++){
        setTimeout(()=>{
            const cx_=80+Math.random()*220,cy_=150+Math.random()*200;
            for(let i=0;i<25;i++)spark(cx_,cy_,
                ['#e65100','#1565c0','#2e7d32','#6a1b9a','#00838f','#ff6d00','#ffd740'][Math.random()*7|0],4);
            shake(6);
        },w*300);
    }
    shake(10);
    // Bonus time
    G.bonus+=10*60;
    G.rampsMade=[false,false,false,false,false];
    G.rampCount=0;
    clearMultiBall();
    // Reset DT for next sprint after celebration
    setTimeout(()=>{
        G.dtProgress=[0,0,0,0,0];
        G.dtComplete=[false,false,false,false,false];
        G.dropHits=0;
        G.testHits=0;
        dropTargets.forEach(d=>{d.hit=false});
        // Pick new innovation
        let next=INNOVATIONS[Math.random()*INNOVATIONS.length|0];
        while(next===inno&&INNOVATIONS.length>1)next=INNOVATIONS[Math.random()*INNOVATIONS.length|0];
        G.currentInno=next;
    },3000);
}

// ─── PHYSICS ─────────────────────────────────────────────────────
function vlen(x,y){return Math.sqrt(x*x+y*y)}
function vdst(a,b,c,d){return vlen(c-a,d-b)}
function vdot(a,b,c,d){return a*c+b*d}
function clamp(v,lo,hi){return v<lo?lo:v>hi?hi:v}
function cpSeg(px,py,x1,y1,x2,y2){
    const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
    if(l2===0)return{x:x1,y:y1};
    const t=clamp(((px-x1)*dx+(py-y1)*dy)/l2,0,1);
    return{x:x1+t*dx,y:y1+t*dy};
}
function capV(b){const s=vlen(b.vx,b.vy);if(s>MAX_V){b.vx=b.vx/s*MAX_V;b.vy=b.vy/s*MAX_V}}

function wallCol(b){
    for(const w of W){
        const c=cpSeg(b.x,b.y,w[0],w[1],w[2],w[3]);
        const d=vdst(b.x,b.y,c.x,c.y);
        if(d<BR&&d>.01){
            const nx=(b.x-c.x)/d,ny=(b.y-c.y)/d;
            b.x=c.x+nx*(BR+.5);b.y=c.y+ny*(BR+.5);
            const vn=vdot(b.vx,b.vy,nx,ny);
            if(vn<0){const r=w[4]||.3;b.vx-=(1+r)*vn*nx;b.vy-=(1+r)*vn*ny;b.vx*=.985;b.vy*=.985;
                if(Math.abs(vn)>.5)SFX.wallHit()}
        }
    }
}

function circleCol(b,B,scoreVal,sfxFn){
    if(B.cd>0){B.cd--;return false}
    const d=vdst(b.x,b.y,B.x,B.y),md=BR+B.r;
    if(d<md&&d>.01){
        const nx=(b.x-B.x)/d,ny=(b.y-B.y)/d;
        b.x=B.x+nx*(md+1);b.y=B.y+ny*(md+1);
        b.vx=nx*B.f;b.vy=ny*B.f;
        B.cd=6;B.fl=16;
        if(G.phase==='play'&&!G.tilt.on){
            addSc(scoreVal);spark(b.x,b.y,B.col||'#e65100',10);
            if(sfxFn)sfxFn();
            shake(2);return true;
        }
        return true;
    }
    return false;
}

// EMPATHIZE bumpers — classic large pop bumpers
function bumpCol(b){
    for(let i=0;i<bumpers.length;i++){
        const B=bumpers[i];
        if(circleCol(b,B,100,bumpSfx[i%3])){

}

// IDEATE mushroom bumpers — smaller, more clustered, rapid fire
function mushroomCol(b){

}

function pit(px,py,x1,y1,x2,y2,x3,y3){
    const s=(a,b,c,d,e,f)=>(a-e)*(d-f)-(c-e)*(b-f);
    const d1=s(px,py,x1,y1,x2,y2),d2=s(px,py,x2,y2,x3,y3),d3=s(px,py,x3,y3,x1,y1);
    return!((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0));
}

function slingCol(b){
    for(const sl of slings){
        if(sl.cd>0){sl.cd--;continue}
        if(pit(b.x,b.y,sl.x1,sl.y1,sl.x2,sl.y2,sl.x3,sl.y3)){
            b.vx+=sl.nx;b.vy+=sl.ny;sl.cd=12;sl.fl=12;
            if(G.phase==='play'&&!G.tilt.on){addSc(50);SFX.sling();shake(2);
                spark((sl.x1+sl.x2+sl.x3)/3,(sl.y1+sl.y2+sl.y3)/3,'#d32f2f',8)}
        }
    }
}

// PROTOTYPE drop targets
function dropCol(b){
    for(const dt of dropTargets){
        if(dt.hit||dt.cd>0){if(dt.cd>0)dt.cd--;continue}
        if(b.x>dt.x-BR&&b.x<dt.x+dt.w+BR&&b.y>dt.y-BR&&b.y<dt.y+dt.h+BR){
            dt.hit=true;dt.cd=30;b.vy=Math.abs(b.vy)*.4;
            G.dropHits++;
            if(G.phase==='play'&&!G.tilt.on){
                addSc(200);SFX.target();
                call(dt.x+8,dt.y-18,'\u{1F6E0}\u{FE0F} BUILD','#00838f');spark(dt.x+8,dt.y,'#00bcd4',5);
                advanceDT(3,0.2); // 5 targets = 100%
                if(G.dropHits>=5){

                    for(let i=0;i<16;i++)spark(115+Math.random()*170,400+Math.random()*30,'#00bcd4',3);
                }
            }
        }
    }
}

// DEFINE spinner
function spinnerCol(b){
    if(spinner.cd>0){spinner.cd--;return}
    if(b.x>spinner.x&&b.x<spinner.x+spinner.w&&
       b.y>spinner.y&&b.y<spinner.y+spinner.h){
        spinner.cd=8;
        const spd=vlen(b.vx,b.vy);
        const spins=Math.max(1,Math.floor(spd/2));
        spinner.spins+=spins;
        spinner.spinTimer=30+spins*5;
        if(G.phase==='play'&&!G.tilt.on){
            SFX.spinner();
            addSc(25*spins);
            // Spinner gives DEFINE progress proportional to speed
            advanceDT(1, spins*0.12); // fast ball = more progress
            call(spinner.x+12,spinner.y-16,'\u{1F3AF}×'+spins,'#6a1b9a');
            spark(spinner.x+12,spinner.y,'#ab47bc',spins*2);
        }
        // Slow ball slightly but don't stop it
        b.vy*=.85;
    }
}

function laneCol(b){
    for(const ln of lanes){
        if(ln.cd>0){ln.cd--;continue}
        if(b.x>ln.x&&b.x<ln.x+ln.w&&b.y>ln.y&&b.y<ln.y+ln.h){
            ln.cd=30;
            if(!ln.lit&&G.phase==='play'&&!G.tilt.on){
                ln.lit=true;G.lanesLit++;addSc(75);SFX.roll();
                call(ln.x+9,ln.y-10,'+75',ln.col);
                if(G.lanesLit>=lanes.length){
                    addSc(1000);G.lanesLit=0;lanes.forEach(l=>{l.lit=false});
                    call(200,110,'ALL 5 LANES! MULTIBALL!','#ff6d00',1);SFX.knocker();shake(4);
                    startMultiBall();
                    for(let i=0;i<12;i++)spark(100+Math.random()*200,120+Math.random()*30,'#ff6d00',3);
                }
            }
        }
    }
}

function updFlip(){
    for(const f of flippers){
        const old=f.angle,spd=f.on?.32:.16,tgt=f.on?f.active:f.rest;
        if(Math.abs(f.angle-tgt)<.01){f.angle=tgt;f.av=0}
        else{const dir=tgt>f.angle?1:-1;f.angle+=dir*spd;
            if((dir>0&&f.angle>tgt)||(dir<0&&f.angle<tgt))f.angle=tgt}
        f.av=f.angle-old;
    }
}

function flipCol(b){
    for(const f of flippers){
        const tx=f.px+Math.cos(f.angle)*f.len,ty=f.py+Math.sin(f.angle)*f.len;
        const c=cpSeg(b.x,b.y,f.px,f.py,tx,ty);
        const d=vdst(b.x,b.y,c.x,c.y),md=BR+FW;
        if(d<md&&d>.01){
            const nx=(b.x-c.x)/d,ny=(b.y-c.y)/d;
            b.x=c.x+nx*(md+.5);b.y=c.y+ny*(md+.5);
            const svx=-f.av*(c.y-f.py)*2.5,svy=f.av*(c.x-f.px)*2.5;
            const vn=vdot(b.vx,b.vy,nx,ny);
            if(vn<0){b.vx-=1.8*vn*nx;b.vy-=1.8*vn*ny}
            b.vx+=svx*.8;b.vy+=svy*.8;capV(b);
        }
    }
}

function chkRamps(b){
    for(const R of ramps){
        if(R.t>0)continue;
        if(b.x>R.ex&&b.x<R.ex+R.ew&&b.y>R.ey&&b.y<R.ey+R.eh){
            if(vlen(b.vx,b.vy)<R.minV||b.vy>2)continue;
            R.t=R.tt;R.ball=b;b.on=false;
            if(G.phase==='play'&&!G.tilt.on){
                SFX.rampEnter();
                const ph=DT_PHASES[R.dtPhase];
                addSc(300);
                call(R.ex+R.ew/2,R.ey-22,ph.icon+' '+R.label,ph.col);
                advanceDT(R.dtPhase,0.5); // 2 ramp completions per phase
                G.rampA[R.idx]=35;
                spark(R.ex+R.ew/2,R.ey,R.col,10);
            }
        }
    }
    for(const R of ramps){
        if(R.t>0){R.t--;
            const rb=R.ball||G.ball;
            if(R.t===0){
                rb.x=R.oxr;rb.y=R.oyr;rb.vx=R.ovx;rb.vy=R.ovy;rb.on=true;R.ball=null;SFX.rampExit();
            }else if(!rb.on){
                const p=1-R.t/R.tt,pi=Math.min(R.path.length-1,(p*R.path.length)|0);
                const ni=Math.min(R.path.length-1,pi+1),lt=p*R.path.length-pi;
                rb.x=R.path[pi].x+(R.path[ni].x-R.path[pi].x)*lt;
                rb.y=R.path[pi].y+(R.path[ni].y-R.path[pi].y)*lt;
            }
        }
    }
}

function chkRoll(b){for(const r of rollovers){if(r.cd>0){r.cd--;continue}
    if(b.x>r.x&&b.x<r.x+r.w&&b.y>r.y&&b.y<r.y+r.h){r.cd=30;if(G.phase==='play'&&!G.tilt.on){addSc(25);SFX.roll()}}}}

function addSc(n){if(!G.tilt.on)G.score+=n}

function nudge(dx,dy){
    if(G.phase!=='play'||G.tilt.on)return;
    const balls=allActiveBalls();
    if(balls.length===0)return;
    for(const b of balls){b.vx+=dx*1.2;b.vy+=dy*.6}
    G.tilt.m+=25;G.nudgeFlash=12;shake(3);
    SFX.tiltWarn();
    if(G.tilt.m>55&&G.tilt.w<1){G.tilt.w=1;call(200,340,'WARNING','#ff6d00',1)}
    if(G.tilt.m>75&&G.tilt.w<2){G.tilt.w=2;call(200,340,'DANGER!','#c62828',1)}
    if(G.tilt.m>=100){G.tilt.on=true;G.tiltFl=120;SFX.tilt();call(200,370,'TILT!','#c62828',1);shake(8)}
}
function updTilt(){if(G.tilt.m>0)G.tilt.m=Math.max(0,G.tilt.m-.25);if(G.tilt.m<40)G.tilt.w=0}

function spark(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=1.5+Math.random()*4;
    G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,life:22+Math.random()*22,ml:44,col,r:2+Math.random()*3})}}
function updParts(){for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.life--;if(p.life<=0)G.parts.splice(i,1)}}
function call(x,y,txt,col,big){G.calls.push({x,y,txt,col,big:!!big,life:85,ml:85})}
function updCalls(){for(let i=G.calls.length-1;i>=0;i--){G.calls[i].life--;G.calls[i].y-=.3;if(G.calls[i].life<=0)G.calls.splice(i,1)}}
function shake(n){G.shake.d=Math.max(G.shake.d,n)}
function updShake(){if(G.shake.d>0){G.shake.x=(Math.random()-.5)*G.shake.d*2;G.shake.y=(Math.random()-.5)*G.shake.d*2;G.shake.d*=.84;if(G.shake.d<.3)G.shake.d=0}else{G.shake.x=0;G.shake.y=0}}

function doLaunch(){
    const b=G.ball;
    const pow=Math.max(0.5,G.plPow);
    b.x=355;b.y=680;b.vx=-0.5;b.vy=-(12+pow*8);
    b.on=true;b.trail=[];
    G.plPow=0;G.plChg=false;G.plReady=false;
    plungerTimer=0;
    SFX.launch();
}

function chkPlayfieldEntry(){
    if(G.phase==='plunger'&&G.ball.on&&G.ball.x<330&&G.ball.y<130){
        G.phase='play';G.timerStarted=true;
    }
}

function chkShooterReturn(){
    if(G.phase!=='plunger'||!G.ball.on)return;
    plungerTimer++;
    const b=G.ball;
    if(b.x>335&&b.y>600&&Math.abs(b.vy)<3&&plungerTimer>30){
        b.vx=0;b.vy=0;b.on=false;b.x=355;b.y=700;
        G.plReady=true;G.plPow=0;G.plChg=false;plungerTimer=0;
    }
    if(plungerTimer>180){
        b.vx=0;b.vy=0;b.on=false;b.x=355;b.y=700;
        G.plReady=true;G.plPow=0;G.plChg=false;plungerTimer=0;
    }
}

function drain(ball){
    const drBall=ball||G.ball;
    drBall.on=false;

    if(drBall!==G.ball){
        const i=G.multiBalls.indexOf(drBall);
        if(i>=0)G.multiBalls.splice(i,1);
        if(G.multiBall.active&&allActiveBalls().length<2){
            clearMultiBall();
            call(200,350,'MULTIBALL ENDED','#ccc');
        }
        return;
    }

    if(G.multiBalls.length>0){
        G.ball=G.multiBalls.shift();
        G.ball.trail=[];
        call(200,350,'BALL SAVED - KEEP GOING','#ffd54f');
        if(G.multiBalls.length===0&&G.multiBall.active){
            clearMultiBall();
            call(200,370,'MULTIBALL ENDED','#ccc');
        }
        return;
    }

    if(G.phase==='drain'||G.phase==='gameover')return;
    G.phase='drain';G.ball.on=false;SFX.drain();
    G.ballsLeft=Math.max(0,G.ballsLeft-1);
    setTimeout(()=>{
        if(G.phase==='gameover'||G.phase==='attract')return;
        if(G.ballsLeft<=0||G.timer+G.bonus<=0){endGame();return}
        G.tilt={m:0,w:0,on:false};G.tiltFl=0;
        G.ball=mkBall(355,700,0,0,false);
        clearMultiBall();
        G.plReady=true;G.plPow=0;G.plChg=false;plungerTimer=0;
        G.phase='plunger';
    },1200);
}

// ─── UPDATE ──────────────────────────────────────────────────────
function update(){
    if(G.phase==='attract'||G.phase==='gameover')return;
    if(G.phase==='play'){G.timer--;if(G.bonus>0)G.bonus--;if(G.timer+G.bonus<=0){endGame();return}}
    G.gi+=.025;
    if(G.phase==='plunger'&&G.plChg)G.plPow=Math.min(1,G.plPow+.018);
    if(G.tilt.on){flippers[0].on=false;flippers[1].on=false}
    updFlip();
    // Spinner animation
    if(spinner.spinTimer>0)spinner.spinTimer--;
    const activeBalls=allActiveBalls();
    for(const b of activeBalls){
        b.vy+=GRAV;
        const spd=vlen(b.vx,b.vy),steps=Math.max(1,Math.min(4,Math.ceil(spd/BR)));
        for(let s=0;s<steps;s++){
            b.x+=b.vx/steps;b.y+=b.vy/steps;
            wallCol(b);bumpCol(b);mushroomCol(b);testTargetCol(b);flipCol(b);slingCol(b);dropCol(b);spinnerCol(b);
        }
        chkRamps(b);chkRoll(b);laneCol(b);capV(b);
        b.trail.push({x:b.x,y:b.y});if(b.trail.length>12)b.trail.shift();
        if(b.y>748){drain(b);continue}
        if(b.x<30){b.x=45;b.vx=Math.abs(b.vx)+1}
        if(b.x>378){b.x=363;b.vx=-Math.abs(b.vx)-1}
        if(b.y<8){b.y=22;b.vy=Math.abs(b.vy)}
        if(G.phase==='play'&&b.x>336&&b.y>130){b.x=330;b.vx=-5;b.vy=-3}
        if(b.y>748){drain(b);continue}

        // Stuck detector only on main ball to avoid false drains in multiball
        if(b===G.ball&&b.y>600){
            const spd_=vlen(b.vx,b.vy);
            if(spd_<1.5){G.stuckTimer++;
                if(G.stuckTimer===90){b.vy+=3;b.vx+=(Math.random()-.5)*4}
                if(G.stuckTimer>180){drain(b);G.stuckTimer=0}
            }else{G.stuckTimer=0}
        }else if(b===G.ball){G.stuckTimer=0}
    }

    if(G.ball.on){
        chkPlayfieldEntry();
        chkShooterReturn();
    }else{
        chkRamps(G.ball);
        let anyRampActive=false;
        for(const R of ramps){if(R.t>0)anyRampActive=true}
        if(!anyRampActive&&G.phase==='play'&&G.multiBalls.length===0){
            G.ball.x=190;G.ball.y=400;G.ball.vx=0;G.ball.vy=2;G.ball.on=true;
        }
    }

    if(G.multiBall.active){
        if(G.multiBall.time>0)G.multiBall.time--;
        if(G.multiBall.beat<=0){playMultiBeat();G.multiBall.beat=8}
        else G.multiBall.beat--;
        if(G.multiBall.time<=0||allActiveBalls().length<2){
            if(G.multiBalls.length>0){
                G.multiBalls=[];
                call(200,350,'MULTIBALL ENDED','#ccc');
            }
            G.multiBall.active=false;
        }
    }
    updTilt();updParts();updCalls();updShake();
    for(let i=0;i<5;i++){if(G.rampA[i]>0)G.rampA[i]--}
    if(G.phaseFl>0)G.phaseFl--;if(G.sprintFl>0)G.sprintFl--;
    if(G.tiltFl>0)G.tiltFl--;
    if(G.nudgeFlash>0)G.nudgeFlash--;
    if(G.innovationDrop.on){
        const d=G.innovationDrop;
        d.vy+=0.22;d.y+=d.vy;
        if(d.y>350){
            d.y=350;
            if(Math.abs(d.vy)>1){d.vy*=-0.35;d.landed=true}
            else d.vy=0;
        }
        if(d.t>0)d.t--;
        if(d.t<=0&&!G.sprintFl)d.on=false;
    }
    bumpers.forEach(b_=>{if(b_.fl>0)b_.fl--});
    mushrooms.forEach(m=>{if(m.fl>0)m.fl--});
    testTargets.forEach(t=>{if(t.fl>0)t.fl--});
    slings.forEach(s=>{if(s.fl>0)s.fl--});
}

function drawRamp3D(x,R,path,col,colL,colD,label){
    x.save();
    const rw=10;
    const ELEV=6; // pixels of elevation offset to create "raised" look
    const leftE=[],rightE=[],leftB=[],rightB=[];
    for(let i=0;i<path.length;i++){
        let nx,ny;
        if(i<path.length-1){nx=path[i+1].y-path[i].y;ny=-(path[i+1].x-path[i].x)}
        else{nx=path[i].y-path[i-1].y;ny=-(path[i].x-path[i-1].x)}
        const l=Math.sqrt(nx*nx+ny*ny)||1;
        leftE.push({x:path[i].x+nx/l*rw,y:path[i].y+ny/l*rw-ELEV});
        rightE.push({x:path[i].x-nx/l*rw,y:path[i].y-ny/l*rw-ELEV});
        leftB.push({x:path[i].x+nx/l*rw,y:path[i].y+ny/l*rw});
        rightB.push({x:path[i].x-nx/l*rw,y:path[i].y-ny/l*rw});
    }
    // Shadow on ground (big, dark — shows elevation)
    x.fillStyle='rgba(0,0,0,.18)';
    x.beginPath();x.moveTo(leftB[0].x+5,leftB[0].y+6);
    for(let i=1;i<leftB.length;i++)x.lineTo(leftB[i].x+5,leftB[i].y+6);
    for(let i=rightB.length-1;i>=0;i--)x.lineTo(rightB[i].x+5,rightB[i].y+6);
    x.closePath();x.fill();
    // Side walls (connects elevated surface to ground — shows height)
    x.fillStyle=colD;x.globalAlpha=.5;
    x.beginPath();x.moveTo(leftB[0].x,leftB[0].y);
    for(let i=1;i<leftB.length;i++)x.lineTo(leftB[i].x,leftB[i].y);
    for(let i=leftE.length-1;i>=0;i--)x.lineTo(leftE[i].x,leftE[i].y);
    x.closePath();x.fill();
    x.beginPath();x.moveTo(rightB[0].x,rightB[0].y);
    for(let i=1;i<rightB.length;i++)x.lineTo(rightB[i].x,rightB[i].y);
    for(let i=rightE.length-1;i>=0;i--)x.lineTo(rightE[i].x,rightE[i].y);
    x.closePath();x.fill();
    x.globalAlpha=1;
    // Elevated surface gradient
    const rg=x.createLinearGradient(path[0].x,path[0].y-ELEV,path[path.length-1].x,path[path.length-1].y-ELEV);
    rg.addColorStop(0,colL);rg.addColorStop(.5,col);rg.addColorStop(1,colD);
    x.fillStyle=rg;
    x.beginPath();x.moveTo(leftE[0].x,leftE[0].y);
    for(let i=1;i<leftE.length;i++)x.lineTo(leftE[i].x,leftE[i].y);
    for(let i=rightE.length-1;i>=0;i--)x.lineTo(rightE[i].x,rightE[i].y);
    x.closePath();x.fill();
    // Top highlight stripe
    x.strokeStyle='rgba(255,255,255,.3)';x.lineWidth=4;x.lineCap='round';x.lineJoin='round';
    x.beginPath();x.moveTo(path[0].x,path[0].y-ELEV);
    for(let i=1;i<path.length;i++)x.lineTo(path[i].x,path[i].y-ELEV);x.stroke();
    // Dark side rails
    x.strokeStyle=colD;x.lineWidth=2.5;x.lineCap='round';
    x.beginPath();x.moveTo(leftE[0].x,leftE[0].y);
    for(let i=1;i<leftE.length;i++)x.lineTo(leftE[i].x,leftE[i].y);x.stroke();
    x.beginPath();x.moveTo(rightE[0].x,rightE[0].y);
    for(let i=1;i<rightE.length;i++)x.lineTo(rightE[i].x,rightE[i].y);x.stroke();
    // Light rail highlight
    x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=1;
    x.beginPath();x.moveTo(leftE[0].x,leftE[0].y);
    for(let i=1;i<leftE.length;i++)x.lineTo(leftE[i].x,leftE[i].y);x.stroke();
    // Centre guide arrows (instead of dashes — clearer direction)
    x.fillStyle='rgba(255,255,255,.2)';
    for(let i=1;i<path.length-1;i+=2){
        const px_=path[i].x,py_=path[i].y-ELEV;
        x.beginPath();x.moveTo(px_,py_-5);x.lineTo(px_-4,py_+3);x.lineTo(px_+4,py_+3);x.closePath();x.fill();
    }
    // Scoop entry — now with 3D depth
    const ex=R.ex,ey=R.ey,ew=R.ew,eh=R.eh;
    // Entry depth wall
    x.fillStyle=colD;x.globalAlpha=.6;
    x.beginPath();x.moveTo(ex,ey+eh);x.lineTo(ex+ew,ey+eh);x.lineTo(ex+ew,ey+eh-ELEV);x.lineTo(ex,ey+eh-ELEV);
    x.closePath();x.fill();x.globalAlpha=1;
    // Entry mouth
    x.fillStyle=colD;x.globalAlpha=.45;
    x.beginPath();x.moveTo(ex,ey+eh-ELEV);x.lineTo(ex+ew,ey+eh-ELEV);x.lineTo(ex+ew-3,ey-ELEV);x.lineTo(ex+3,ey-ELEV);
    x.closePath();x.fill();x.globalAlpha=1;
    // Highlight lip
    x.fillStyle=colL;x.globalAlpha=.4;x.fillRect(ex+3,ey-ELEV+2,ew-6,4);x.globalAlpha=1;
    // Big up arrow
    x.fillStyle=col;x.globalAlpha=.8;
    const mx=ex+ew/2,my=ey+eh-ELEV-6;
    x.beginPath();x.moveTo(mx,my-12);x.lineTo(mx-8,my+3);x.lineTo(mx+8,my+3);x.closePath();x.fill();
    x.globalAlpha=1;
    // Label with icon
    x.font='bold 8px Courier New';x.textAlign='center';x.fillStyle=col;
    x.fillText('\u25B2 '+label,ex+ew/2,ey+eh+14);
    x.restore();
}

function drawBumper(ctx,B,flash){
    const r=B.r;
    // Shadow
    ctx.beginPath();ctx.arc(B.x+2,B.y+3,r+2,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,.2)';ctx.fill();
    // Chrome ring
    ctx.beginPath();ctx.arc(B.x,B.y,r+2.5,0,Math.PI*2);ctx.fillStyle='#444';ctx.fill();
    ctx.beginPath();ctx.arc(B.x,B.y,r+1,0,Math.PI*2);ctx.fillStyle=B.dcol;ctx.fill();
    // Main body
    ctx.beginPath();ctx.arc(B.x,B.y,r,0,Math.PI*2);
    const g=ctx.createRadialGradient(B.x-3,B.y-3,1,B.x,B.y,r);
    if(flash){g.addColorStop(0,'#fff');g.addColorStop(.25,B.lcol);g.addColorStop(.75,B.col);g.addColorStop(1,B.dcol)}
    else{g.addColorStop(0,B.lcol);g.addColorStop(.45,B.col);g.addColorStop(1,B.dcol)}
    ctx.fillStyle=g;ctx.fill();
    // Specular
    ctx.beginPath();ctx.arc(B.x-r*.28,B.y-r*.28,r*.2,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,'+(flash?.5:.18)+')';ctx.fill();
    // Label
    const sz=r>=14?9:r>=10?7:6;
    ctx.font='bold '+sz+'px Courier New';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=flash?'#fff':'rgba(255,255,255,.85)';
    const tw=ctx.measureText(B.txt).width;
    if(tw>r*1.6){ctx.font='bold '+Math.max(5,Math.floor(sz*r*1.6/tw))+'px Courier New'}
    ctx.fillText(B.txt,B.x,B.y);ctx.textBaseline='alphabetic';
    // Optional directional marker for angled/tilted bumpers
    if(B.tilt!==undefined){
        const dx=Math.cos(B.tilt)*(r*.95),dy=Math.sin(B.tilt)*(r*.95);
        ctx.strokeStyle=flash?'#fff':'rgba(255,255,255,.75)';
        ctx.lineWidth=2.2;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(B.x-dx,B.y-dy);ctx.lineTo(B.x+dx,B.y+dy);ctx.stroke();
        ctx.lineCap='butt';
    }
    // Flash ring
    if(flash){ctx.beginPath();ctx.arc(B.x,B.y,r+5,0,Math.PI*2);
        ctx.strokeStyle='rgba(255,171,0,'+(B.fl/16*.6)+')';ctx.lineWidth=3;ctx.stroke()}
}

// Mushroom bumpers — flat topped, different visual from pop bumpers
function drawMushroom(ctx,M,flash){
    const r=M.r;
    // Shadow
    ctx.beginPath();ctx.arc(M.x+1,M.y+2,r+1,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,.15)';ctx.fill();
    // Stem
    ctx.fillStyle=flash?M.lcol:'#8d6e63';
    ctx.fillRect(M.x-3,M.y+r*.3,6,r*.7);
    // Cap (oval)
    ctx.beginPath();ctx.ellipse(M.x,M.y-r*.1,r+1,r*.7,0,0,Math.PI*2);
    const g=ctx.createRadialGradient(M.x-2,M.y-r*.3,1,M.x,M.y,r);
    if(flash){g.addColorStop(0,'#fff');g.addColorStop(.3,M.lcol);g.addColorStop(1,M.col)}
    else{g.addColorStop(0,M.lcol);g.addColorStop(.5,M.col);g.addColorStop(1,M.dcol)}
    ctx.fillStyle=g;ctx.fill();
    // Spots
    ctx.fillStyle='rgba(255,255,255,'+(flash?.6:.25)+')';
    ctx.beginPath();ctx.arc(M.x-r*.3,M.y-r*.25,r*.15,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(M.x+r*.25,M.y-r*.15,r*.12,0,Math.PI*2);ctx.fill();
    // Icon
    ctx.font='bold '+(r>=10?10:8)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(M.txt,M.x,M.y-r*.15);ctx.textBaseline='alphabetic';
    // Flash ring
    if(flash){ctx.beginPath();ctx.arc(M.x,M.y,r+4,0,Math.PI*2);
        ctx.strokeStyle='rgba(255,143,0,'+(M.fl/16*.6)+')';ctx.lineWidth=2.5;ctx.stroke()}
}

function drawStageRail(ctx){
    const px=5,py=120,pw=30,ph=260;
    ctx.save();
    ctx.fillStyle='rgba(25,25,25,.82)';ctx.fillRect(px,py,pw,ph);
    ctx.strokeStyle='#ff8f00';ctx.lineWidth=1.5;ctx.strokeRect(px+.5,py+.5,pw-1,ph-1);
    ctx.font='bold 7px Courier New';ctx.textAlign='center';
    ctx.fillStyle='#ffd54f';ctx.fillText('DT',px+pw/2,py+10);
    for(let i=0;i<5;i++){
        const y=py+34+i*44,phs=DT_PHASES[i],done=G.dtComplete[i];
        ctx.beginPath();ctx.arc(px+pw/2,y,9,0,Math.PI*2);
        ctx.fillStyle=done?phs.col:'rgba(255,255,255,.14)';ctx.fill();
        ctx.lineWidth=1.5;ctx.strokeStyle=done?'#fff':'rgba(255,255,255,.2)';ctx.stroke();
        ctx.font='bold 8px Courier New';ctx.fillStyle=done?'#fff':'#999';
        ctx.fillText(String(i+1),px+pw/2,y+3);
    }
    ctx.font='bold 6px Courier New';ctx.fillStyle='#bbb';ctx.fillText('STAGES',px+pw/2,py+248);
    ctx.restore();
}

function drawNudgePanel(ctx){

}

    x.font='bold 8px Courier New';x.fillStyle='#00838f';x.globalAlpha=.45;x.textAlign='center';

            x.beginPath();x.moveTo(ax,yy);x.lineTo(ax-6,yy+11);x.lineTo(ax+6,yy+11);x.closePath();x.fill()}

    return c;
}

function buildSL(){

    const x=c.getContext('2d');
    const g=x.createRadialGradient(PW/2,PH/2,PW*.25,PW/2,PH/2,PW*.85);

    x.fillStyle=g;x.fillRect(0,0,PW,PH);
    return c;
}

function render(){
    if(!stCache){stCache=buildStatic();slCache=buildSL()}
    cx.clearRect(0,0,cv.width,cv.height);
    cx.save();cx.scale(S,S);cx.translate(G.shake.x,G.shake.y);
    cx.drawImage(stCache,0,0);

    // Ambient glow
    cx.fillStyle='rgba(255,200,100,'+(0.006+Math.sin(G.gi)*.004)+')';cx.fillRect(38,13,302,737);
    drawStageRail(cx);

    // Star lanes
    for(const ln of lanes){
        if(ln.lit){
            cx.fillStyle=ln.col;cx.globalAlpha=.6+Math.sin(G.gi*4)*.2;
            cx.beginPath();const cx_=ln.x+9,cy_=ln.y+15;
            for(let i=0;i<5;i++){const a=i*Math.PI*2/5-Math.PI/2;
                cx.lineTo(cx_+Math.cos(a)*8,cy_+Math.sin(a)*8);
                const a2=a+Math.PI/5;cx.lineTo(cx_+Math.cos(a2)*3.5,cy_+Math.sin(a2)*3.5)}
            cx.closePath();cx.fill();cx.globalAlpha=1;
        }else{cx.fillStyle='rgba(0,0,0,.06)';cx.fillRect(ln.x+3,ln.y+5,12,20)}
    }

    // Spinner gate (animated)
    const sa=spinner.spinTimer>0?G.gi*15:0;
    cx.save();cx.translate(spinner.x+spinner.w/2,spinner.y+spinner.h/2);
    cx.rotate(sa);
    cx.fillStyle=spinner.spinTimer>0?'#ab47bc':'#7b1fa2';
    cx.fillRect(-2,-spinner.h/2+4,4,spinner.h-8);
    cx.restore();
    // Glow if spinning
    if(spinner.spinTimer>0){
        cx.fillStyle='rgba(171,71,188,'+(0.15+Math.sin(G.gi*8)*.08)+')';
        cx.beginPath();cx.arc(spinner.x+spinner.w/2,spinner.y+spinner.h/2,18,0,Math.PI*2);cx.fill();
    }

    // Ramp LEDs (chase lights for active ramps)
    const drawChase=function(path,col,timer){
        for(let i=0;i<6;i++){const t_=((timer*.035+i/6)%1);
            const pi=Math.min(path.length-1,(t_*(path.length-1))|0);
            const ni=Math.min(path.length-1,pi+1),lt_=t_*(path.length-1)-pi;
            cx.beginPath();cx.arc(path[pi].x+(path[ni].x-path[pi].x)*lt_,path[pi].y+(path[ni].y-path[pi].y)*lt_,3.5,0,Math.PI*2);
            cx.fillStyle=col;cx.globalAlpha=.8;cx.fill();cx.globalAlpha=1}};
    for(let i=0;i<5;i++){
        if(G.rampA[i]>0)drawChase(ramps[i].path,ramps[i].col,G.rampA[i]);
    }

    // Phase completion glow on ramp entries
    for(let i=0;i<5;i++){
        if(!G.dtComplete[i]&&G.dtProgress[i]>0){
            const R=ramps[i];
            cx.fillStyle=R.col;cx.globalAlpha=G.dtProgress[i]*0.25;
            cx.beginPath();cx.arc(R.ex+R.ew/2,R.ey+R.eh/2,R.ew*.8,0,Math.PI*2);cx.fill();cx.globalAlpha=1;
        }
    }

    // Drop targets
    for(const dt of dropTargets){
        if(!dt.hit){cx.fillStyle='rgba(0,0,0,.12)';cx.fillRect(dt.x+1,dt.y+1,dt.w,dt.h);
            const dg=cx.createLinearGradient(dt.x,dt.y,dt.x,dt.y+dt.h);
            dg.addColorStop(0,'#00acc1');dg.addColorStop(1,'#00838f');
            cx.fillStyle=dg;cx.fillRect(dt.x,dt.y,dt.w,dt.h);
            cx.fillStyle='#4dd0e1';cx.fillRect(dt.x+1,dt.y+1,dt.w-2,3);
        }else{cx.fillStyle='#ccc';cx.fillRect(dt.x,dt.y+10,dt.w,dt.h-10)}}

    // Bumpers (EMPATHIZE)
    for(const B of bumpers)drawBumper(cx,B,B.fl>0);
    // Mushrooms (IDEATE)
    for(const M of mushrooms)drawMushroom(cx,M,M.fl>0);
    // Test targets
    for(const T of testTargets)drawBumper(cx,T,T.fl>0);

    // Slingshots (visual only)
    for(const sl of slings){const fl=sl.fl>0;
        cx.beginPath();cx.moveTo(sl.x1,sl.y1);cx.lineTo(sl.x2,sl.y2);cx.lineTo(sl.x3,sl.y3);cx.closePath();
        cx.fillStyle=fl?'rgba(211,47,47,.5)':'rgba(211,47,47,.08)';cx.fill();
        cx.strokeStyle=fl?'#c62828':'#bbb';cx.lineWidth=1.5;cx.stroke()}

    // Flippers
    for(const f of flippers){
        const tx=f.px+Math.cos(f.angle)*f.len,ty=f.py+Math.sin(f.angle)*f.len;
        cx.lineCap='round';
        cx.strokeStyle='rgba(0,0,0,.25)';cx.lineWidth=FW*2+5;
        cx.beginPath();cx.moveTo(f.px+1,f.py+2);cx.lineTo(tx+1,ty+2);cx.stroke();
        cx.strokeStyle=f.on?'#e65100':'#bf360c';cx.lineWidth=FW*2+1;
        cx.beginPath();cx.moveTo(f.px,f.py);cx.lineTo(tx,ty);cx.stroke();
        cx.strokeStyle=f.on?'#ff8f00':'#e65100';cx.lineWidth=FW-1;
        cx.beginPath();cx.moveTo(f.px,f.py);cx.lineTo(tx,ty);cx.stroke();
        cx.beginPath();cx.arc(f.px,f.py,5,0,Math.PI*2);cx.fillStyle='#555';cx.fill();
        cx.beginPath();cx.arc(f.px,f.py,2.5,0,Math.PI*2);cx.fillStyle='#aaa';cx.fill();
        cx.lineCap='butt';
    }

    // Plunger
    if(G.phase==='plunger'&&!G.ball.on&&G.multiBalls.length===0){
        const py=718+G.plPow*28;
        cx.fillStyle='#555';cx.fillRect(350,py,12,30);
        const hg=cx.createLinearGradient(350,py,362,py);
        hg.addColorStop(0,'#e65100');hg.addColorStop(.5,'#ff6d00');hg.addColorStop(1,'#e65100');
        cx.fillStyle=hg;cx.fillRect(348,py-4,16,10);
        const mh=120,mx_=375,my_=580;
        cx.fillStyle='rgba(0,0,0,.15)';cx.fillRect(mx_,my_,8,mh);
        if(G.plPow>0){const ph=mh*G.plPow;
            const pg=cx.createLinearGradient(mx_,my_+mh-ph,mx_,my_+mh);
            pg.addColorStop(0,G.plPow>.7?'#c62828':'#ff6d00');pg.addColorStop(1,'#ffcc80');
            cx.fillStyle=pg;cx.fillRect(mx_,my_+mh-ph,8,ph)}
        cx.font='bold 10px Courier New';cx.textAlign='center';
        if(G.plChg){cx.fillStyle='#e65100';cx.fillText('RELEASE!',356,706)}
        else{cx.fillStyle=Math.sin(G.gi*5)>.0?'#e65100':'#bf360c';cx.fillText('HOLD',356,696);cx.fillText('SPACE',356,710)}
    }

    // Balls
    const drawBall=function(b,isMulti){
        if(b.trail.length>1)for(let i=0;i<b.trail.length;i++){
            cx.beginPath();cx.arc(b.trail[i].x,b.trail[i].y,BR*i/b.trail.length*.5,0,Math.PI*2);
            cx.fillStyle='rgba(120,120,130,'+(i/b.trail.length*.2)+')';cx.fill();
        }
        if(b.on||G.phase==='plunger'||G.phase==='drain'){
            cx.beginPath();cx.arc(b.x+1.5,b.y+2,BR,0,Math.PI*2);cx.fillStyle='rgba(0,0,0,.2)';cx.fill();
            const bg=cx.createRadialGradient(b.x-2,b.y-2,1,b.x,b.y,BR);
            if(isMulti){
                bg.addColorStop(0,'#fff59d');bg.addColorStop(.3,'#ffe082');bg.addColorStop(.7,'#ffca28');bg.addColorStop(1,'#f57f17');
            }else{
                bg.addColorStop(0,'#e0e0e0');bg.addColorStop(.3,'#bbb');bg.addColorStop(.7,'#777');bg.addColorStop(1,'#444');
            }
            cx.beginPath();cx.arc(b.x,b.y,BR,0,Math.PI*2);cx.fillStyle=bg;cx.fill();
            cx.beginPath();cx.arc(b.x-2,b.y-2,BR*.28,0,Math.PI*2);cx.fillStyle='rgba(255,255,255,.75)';cx.fill();
        }
        if(!b.on){
            for(const R of ramps){
                if(R.t>0&&R.ball===b){
                    cx.beginPath();cx.arc(b.x,b.y,BR*.7,0,Math.PI*2);cx.fillStyle='rgba(120,120,130,.35)';cx.fill();break;
                }
            }
        }
    };
    drawBall(G.ball,false);
    for(const mb of G.multiBalls)drawBall(mb,true);

    // Particles
    for(const p of G.parts){const a=p.life/p.ml;cx.beginPath();cx.arc(p.x,p.y,p.r*a,0,Math.PI*2);
        cx.fillStyle=p.col;cx.globalAlpha=a;cx.fill();cx.globalAlpha=1}

    // Callouts
    for(const c_ of G.calls){const a=c_.life/c_.ml,sz=c_.big?16:11;
        cx.font='bold '+sz+'px Courier New';cx.textAlign='center';
        cx.strokeStyle='rgba(255,255,255,.7)';cx.lineWidth=3;cx.strokeText(c_.txt,c_.x,c_.y);
        cx.fillStyle=c_.col;cx.globalAlpha=a;cx.fillText(c_.txt,c_.x,c_.y);cx.globalAlpha=1}

    // Flashes
    if(G.phaseFl>0){
        const fCol=G.lastPhase>=0?DT_PHASES[G.lastPhase].col:'#64b5f6';
        cx.fillStyle=fCol;cx.globalAlpha=G.phaseFl*.002;cx.fillRect(0,0,PW,PH);cx.globalAlpha=1;
    }
    if(G.sprintFl>0){
        // Big celebration overlay
        const sf=G.sprintFl;
        // Background flash — golden pulse
        cx.fillStyle='rgba(255,152,0,'+(Math.min(.25,sf*.003))+')';cx.fillRect(0,0,PW,PH);
        // Radial burst
        if(sf>150){
            cx.save();cx.translate(200,350);
            const burstA=(240-sf)/90;
            for(let r=0;r<12;r++){
                cx.rotate(Math.PI/6);
                cx.fillStyle=['#e65100','#1565c0','#2e7d32','#6a1b9a','#00838f','#ff6d00'][r%6];
                cx.globalAlpha=burstA*.3;
                cx.fillRect(-4,30,8,80+sf*.3);
            }
            cx.globalAlpha=1;cx.restore();
        }
        // Main text block
        if(sf>60){
            const ta=Math.min(1,(sf-60)/40);
            cx.globalAlpha=ta;
            // Dark overlay box
            cx.fillStyle='rgba(0,0,0,.7)';
            const bx=40,by=200,bw=300,bh=200;
            cx.beginPath();cx.moveTo(bx+12,by);cx.lineTo(bx+bw-12,by);cx.quadraticCurveTo(bx+bw,by,bx+bw,by+12);
            cx.lineTo(bx+bw,by+bh-12);cx.quadraticCurveTo(bx+bw,by+bh,bx+bw-12,by+bh);
            cx.lineTo(bx+12,by+bh);cx.quadraticCurveTo(bx,by+bh,bx,by+bh-12);
            cx.lineTo(bx,by+12);cx.quadraticCurveTo(bx,by,bx+12,by);cx.closePath();cx.fill();
            // Gold border
            cx.strokeStyle='#ff6d00';cx.lineWidth=3;cx.stroke();
            // INNOVATION SHIPPED!
            cx.font='bold 10px Courier New';cx.textAlign='center';cx.fillStyle='#ffa726';
            cx.fillText('INNOVATION SHIPPED!',190,225);
            // Rocket + product name
            cx.font='bold 22px Courier New';cx.fillStyle='#fff';
            cx.fillText('\u{1F680}',190,260);
            cx.font='bold 16px Courier New';cx.fillStyle='#66bb6a';
            const innoName=G.shippedInno||G.currentInno;
            cx.fillText(innoName,190,290);
            // Sprint count
            cx.font='bold 12px Courier New';cx.fillStyle='#ffa726';
            cx.fillText('Sprint #'+G.sprints+' Complete!',190,320);
            // Bonus
            cx.font='bold 10px Courier New';cx.fillStyle='#4dd0e1';
            cx.fillText('+10s bonus time \u2022 +'+(1000+G.sprints*500)+' pts',190,345);
            // Next innovation teaser
            if(sf<120){
                cx.font='bold 9px Courier New';cx.fillStyle='#aaa';
                cx.fillText('Next challenge loading...',190,375);
            }
            cx.globalAlpha=1;
        }
    }
    if(G.tiltFl>0&&G.tiltFl%10<5){cx.fillStyle='rgba(198,40,40,.12)';cx.fillRect(0,0,PW,PH)}
    cx.drawImage(slCache,0,0);
    drawInnovationDrop(cx);
    drawNudgePanel(cx);
    cx.restore();
    drawHUD();
}

function drawHUD(){
    cx.save();cx.scale(S,S);
    // Main HUD bar — taller for better readability
    cx.fillStyle='rgba(33,33,33,.94)';cx.fillRect(0,0,PW,66);
    cx.strokeStyle='#e65100';cx.lineWidth=2;cx.beginPath();cx.moveTo(0,66);cx.lineTo(PW,66);cx.stroke();

    // Timer
    const ss=Math.max(0,Math.ceil((G.timer+G.bonus)/60));
    cx.font='bold 13px Courier New';cx.textAlign='left';
    cx.fillStyle=G.phase==='plunger'&&!G.timerStarted?'#888':ss>20?'#66bb6a':ss>10?'#ffa726':'#ef5350';
    cx.fillText(G.phase==='plunger'&&!G.timerStarted?'\u23F8':ss+'s',6,14);

    // Score
    cx.font='bold 16px Courier New';cx.textAlign='center';cx.fillStyle='#fff';
    cx.fillText(G.score.toLocaleString(),200,14);

    // Sprint counter
    cx.font='bold 10px Courier New';cx.textAlign='right';cx.fillStyle='#ff6d00';
    cx.fillText('\u{1F680} '+G.sprints,394,14);

    // ── GOAL: Innovation name in big letters ──
    cx.font='bold 11px Courier New';cx.textAlign='center';
    cx.fillStyle='#ffa726';
    cx.fillText('\u{1F4CB} Ship: '+G.currentInno.toUpperCase(),200,30);

    // ── DT Phase progress — 5 icon segments ──
    const barY=36,barH=12,barX=8,barW=384;
    cx.fillStyle='rgba(0,0,0,.4)';cx.fillRect(barX,barY,barW,barH);

    const phW=barW/5;
    const doneCount=G.dtComplete.filter(Boolean).length;
    for(let i=0;i<5;i++){
        const ph=DT_PHASES[i];
        const px_=barX+i*phW;
        // Background
        cx.fillStyle=G.dtProgress[i]>0?'rgba(255,255,255,.08)':'rgba(0,0,0,.2)';
        cx.fillRect(px_+1,barY+1,phW-2,barH-2);
        // Progress fill
        if(G.dtProgress[i]>0){
            const fillW=(phW-2)*Math.min(1,G.dtProgress[i]);
            cx.fillStyle=G.dtComplete[i]?ph.col:ph.lcol;
            cx.globalAlpha=G.dtComplete[i]?1:.65;
            cx.fillRect(px_+1,barY+1,fillW,barH-2);
            cx.globalAlpha=1;
        }
        // Phase icon + short label
        cx.font='bold 7px Courier New';cx.textAlign='center';
        cx.fillStyle=G.dtComplete[i]?'#fff':(G.dtProgress[i]>0?'#ddd':'#777');
        cx.fillText(ph.icon+(G.dtComplete[i]?'\u2713':''),px_+phW/2,barY+barH-2);
    }

    // Progress count
    cx.font='bold 10px Courier New';cx.textAlign='center';
    cx.fillStyle=G.lanesLit>=4?'#66bb6a':G.lanesLit>=2?'#ffd54f':'#aaa';
    cx.fillText('LANES '+G.lanesLit+'/5  |  PHASES '+doneCount+'/5',200,62);

    cx.font='bold 10px Courier New';cx.textAlign='right';cx.fillStyle=G.ballsLeft>1?'#bbdefb':'#ffccbc';
    cx.fillText('\u{1F3B1} '+G.ballsLeft,394,30);
    if(G.practice){
        cx.font='bold 8px Courier New';cx.textAlign='left';cx.fillStyle='#90caf9';
        cx.fillText('PRACTICE MODE',6,30);
    }

    if(G.multiBall.active){
        const mbS=Math.ceil(G.multiBall.time/60);
        cx.font='bold 10px Courier New';cx.textAlign='left';
        cx.fillStyle=mbS>6?'#ffd54f':'#ff8a65';
        cx.fillText('MULTIBALL '+mbS+'s',6,62);
    }

    // Tilt meter
    if(G.tilt.m>10){cx.fillStyle='#444';cx.fillRect(352,barY+barH+4,40,4);
        cx.fillStyle=G.tilt.w>=2?'#ef5350':G.tilt.w>=1?'#ffa726':'#5c6bc0';cx.fillRect(352,barY+barH+4,40*(G.tilt.m/100),4)}
    if(G.tilt.on){cx.font='bold 18px Courier New';cx.textAlign='center';
        cx.fillStyle=G.tiltFl%10<5?'#ef5350':'#b71c1c';cx.fillText('TILT',200,85)}

    // NUDGE hint — bottom of screen
    if(G.phase==='play'&&!G.tilt.on){
        cx.fillStyle='rgba(0,0,0,.55)';cx.fillRect(8,778,280,16);
        cx.strokeStyle='rgba(255,255,255,.2)';cx.strokeRect(8.5,778.5,279,15);
        cx.font='bold 8px Courier New';cx.textAlign='left';
        cx.fillStyle='#ffe082';
        cx.fillText('NUDGE: press N or tap orange button | too much = TILT',12,789);
    }

    cx.restore();
}

// ─── INPUT ───────────────────────────────────────────────────────
const keys={};
function inNudgeButton(x,y){return x>=NUDGE_BTN.x&&x<=NUDGE_BTN.x+NUDGE_BTN.w&&y>=NUDGE_BTN.y&&y<=NUDGE_BTN.y+NUDGE_BTN.h}
document.addEventListener('keydown',function(e){
    if(keys[e.code])return;keys[e.code]=true;initA();resumeA();
    if((e.code==='ArrowLeft'||e.code==='KeyA')&&!e.shiftKey){flippers[0].on=true;SFX.flipper()}
    if((e.code==='ArrowRight'||e.code==='KeyD')&&!e.shiftKey){flippers[1].on=true;SFX.flipper()}
    if(e.code==='Space'){e.preventDefault();
        if(G.phase==='plunger'&&G.plReady&&allActiveBalls().length===0){G.plChg=true;G.plPow=0}}
    if(e.code==='KeyT'||e.code==='KeyN'){nudge((Math.random()-.5)*2,-0.5-Math.random())}
});
document.addEventListener('keyup',function(e){
    keys[e.code]=false;
    if(e.code==='ArrowLeft'||e.code==='KeyA')flippers[0].on=false;
    if(e.code==='ArrowRight'||e.code==='KeyD')flippers[1].on=false;
    if(e.code==='Space'){if(G.phase==='plunger'&&G.plChg&&allActiveBalls().length===0)doLaunch();G.plChg=false}
});

let tch={};
cv.addEventListener('touchstart',function(e){
    e.preventDefault();initA();resumeA();
    for(const t of e.changedTouches){
        const tx_=(t.clientX-ox)/cv.clientWidth*PW,ty_=(t.clientY-oy)/cv.clientHeight*PH;
        tch[t.identifier]={x:tx_,y:ty_,sx:tx_,sy:ty_,st:Date.now()};
        if(inNudgeButton(tx_,ty_)){nudge((Math.random()-.5)*2,-0.5-Math.random());tch[t.identifier].ng=true;continue}
        if(tx_>300&&ty_>620){if(G.phase==='plunger'&&G.plReady&&allActiveBalls().length===0){G.plChg=true;G.plPow=0;tch[t.identifier].pl=true}}
        else if(tx_<PW/2){flippers[0].on=true;tch[t.identifier].fl='L';SFX.flipper()}
        else{flippers[1].on=true;tch[t.identifier].fl='R';SFX.flipper()}
    }
},{passive:false});
cv.addEventListener('touchend',function(e){
    e.preventDefault();
    for(const t of e.changedTouches){
        const td=tch[t.identifier];if(!td)continue;
        if(td.ng){delete tch[t.identifier];continue}
        if(td.fl==='L')flippers[0].on=false;if(td.fl==='R')flippers[1].on=false;
        if(td.pl){if(G.phase==='plunger'&&G.plChg&&allActiveBalls().length===0)doLaunch();G.plChg=false}
        const dx_=(t.clientX-ox)/cv.clientWidth*PW-td.sx,dy_=(t.clientY-oy)/cv.clientHeight*PH-td.sy;
        if(!td.pl&&Date.now()-td.st<200&&(Math.abs(dx_)>20||Math.abs(dy_)>20)){
            nudge(dx_>0?1:-1,-0.5)}
        delete tch[t.identifier];
    }
},{passive:false});
cv.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});
cv.addEventListener('mousedown',function(e){
    const x=(e.clientX-ox)/cv.clientWidth*PW,y=(e.clientY-oy)/cv.clientHeight*PH;
    if(inNudgeButton(x,y)){initA();resumeA();nudge((Math.random()-.5)*2,-0.5-Math.random())}
});

// ─── MAIN LOOP ───────────────────────────────────────────────────
let lt=0,acc=0;
function loop(ts){if(!lt)lt=ts;let d=ts-lt;lt=ts;if(d>50)d=50;acc+=d;
    while(acc>=DT){update();acc-=DT}render();requestAnimationFrame(loop)}

showAttract();requestAnimationFrame(loop);
})();
</script>
