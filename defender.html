              topDomain: topInnovation ? topInnovation.name : 'General Innovation',
              topDomainKey: topInnovation ? topInnovation.key : null
            }, '*');
          } catch(e) {}
        }

        const followup = trainingDone
          ? 'Press 2 to continue to Field Operation, or Enter to replay training.'
          : (won
            ? 'Run complete. Press Enter to replay, or choose another mode.'
            : 'Press Enter to retry, or choose another mission with 1/2/3.');

        const returnBtn = isEmbedded
          ? `<button class="btn" data-action="return-to-manager">\u2190 Return to The Disruptor</button>`
          : '';

        overlayPanel.innerHTML = `
          <div class="title" style="color:${statusColor}">${statusText}</div>
          <div>Mission: ${currentMission.label}</div>
          <div>Rounds Completed: ${campaignRound}/3</div>
          <div>Run Goal: ${rescuedLeadUsers}/${runGoal} captured insights</div>
          <div style="margin-top: 4px; color: #9defff;">Next Selection</div>
          <div class="btn-row">
            <button class="btn ${selectedMissionId === 'practice' ? 'active' : ''}" data-action="select-mission" data-mission="practice">Training</button>
            <button class="btn ${selectedMissionId === 'standard' ? 'active' : ''}" data-action="select-mission" data-mission="standard">Regular</button>
            <button class="btn ${selectedMissionId === 'veteran' ? 'active' : ''}" data-action="select-mission" data-mission="veteran">Advanced</button>
          </div>
          <div style="margin-top: 4px; color: #ffe59c;">Selected: ${m.label} (${m.difficulty})</div>
          <div>Score: ${Math.floor(score)}</div>
          <div>Lead User Insights Captured: ${rescuedLeadUsers}</div>
          <div>Lead User Signals Missed: ${lostLeadUsers}</div>
          <div>Lead User Signals Active: ${alive}</div>
          <div style="margin-top: 8px;">Innovation Value Transferred: ${rescuedLeadUsers * currentMission.valuePerLeadUser}</div>
          <div style="margin-top: 6px;">Insight Notes: ${insightSummary}</div>
          <div style="margin-top: 6px; color: #9defff;">Top Lead-User Domain: ${topInnovation ? topInnovation.name : 'None'}</div>
          <div style="margin-top: 6px; color: #9defff;">Unlocks: ${unlockedLine}</div>
          <div style="margin-top: 6px; color: #b9f7ff;">Educational Sim Sync: ${syncShort}</div>
          <div style="margin-top: 10px; color: #ffd166;">${followup}</div>
          <div class="btn-row">
            <button class="btn launch" data-action="launch">Play Selected Mission</button>
            <button class="btn" data-action="title">Back to Briefing</button>
            ${returnBtn}
          </div>
        `;
      }

      function pickInnovation() {
        return innovationCatalog[Math.floor(Math.random() * innovationCatalog.length)];
      }

      function findInnovation(key) {
        return innovationCatalog.find(i => i.key === key);
      }

      function loadMetaProgress() {
        const fallback = {
          totalRescues: 0,
          innovations: Object.fromEntries(innovationCatalog.map(i => [i.key, { rescued: 0, unlocked: false }])),
        };
        try {
          const raw = localStorage.getItem('retro_patrol_progress_v1');
          if (!raw) return fallback;
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== 'object') return fallback;
          parsed.innovations = parsed.innovations || {};
          for (const i of innovationCatalog) {
            if (!parsed.innovations[i.key]) {
              parsed.innovations[i.key] = { rescued: 0, unlocked: false };
            }
          }
          return parsed;
        } catch {
          return fallback;
        }
      }

      function saveMetaProgress() {
        try {
          localStorage.setItem('retro_patrol_progress_v1', JSON.stringify(metaProgress));
        } catch {}
      }

      function registerInnovationRescue(human) {
        const key = human.innovationKey;
        if (!key || !metaProgress.innovations[key]) return;
        missionInnovationRescues[key] = (missionInnovationRescues[key] || 0) + 1;
        metaProgress.totalRescues += 1;
        metaProgress.innovations[key].rescued += 1;
        const meta = metaProgress.innovations[key];
        const info = findInnovation(key);
        if (!meta.unlocked && meta.rescued >= info.threshold) {
          meta.unlocked = true;
          missionUnlocks.push(key);
          score += 250;
        }
        saveMetaProgress();
      }

      function pickTopMissionInnovation() {
        let bestKey = null;
        let best = -1;
        for (const [k, v] of Object.entries(missionInnovationRescues)) {
          if (v > best) {
            best = v;
            bestKey = k;
          }
        }
        return bestKey ? findInnovation(bestKey) : null;
      }

      function buildSimSyncPayload() {
        const payload = {
          mission: currentMission.id,
          rescuedLeadUsers,
          lostLeadUsers,
          rescuedByInnovation: missionInnovationRescues,
          unlocked: missionUnlocks,
          totals: metaProgress,
          ts: Date.now(),
        };
        return `SIMSYNC1:${btoa(JSON.stringify(payload))}`;
      }

      function ensureAudio() {
        if (audioCtx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.18;
        masterGain.connect(audioCtx.destination);
        noiseBuffer = makeNoiseBuffer();
        musicNextTime = audioCtx.currentTime + 0.05;
        musicStep = 0;
      }

      function makeNoiseBuffer() {
        if (!audioCtx) return null;
        const len = Math.floor(audioCtx.sampleRate * 0.25);
        const b = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        const ch = b.getChannelData(0);
        for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
        return b;
      }

      function playTone(freq, type, attack, decay, gainAmt, glide = null) {
        if (!audioCtx || !masterGain) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (glide) osc.frequency.exponentialRampToValueAtTime(Math.max(35, glide), now + decay);
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(gainAmt, now + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, now + decay);
        osc.connect(g);
        g.connect(masterGain);
        osc.start(now);
        osc.stop(now + decay + 0.03);
      }

      function playNoise(decay, gainAmt) {
        if (!audioCtx || !masterGain || !noiseBuffer) return;
        const now = audioCtx.currentTime;
        const src = audioCtx.createBufferSource();
        src.buffer = noiseBuffer;
        const hp = audioCtx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 600;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(gainAmt, now);
        g.gain.exponentialRampToValueAtTime(0.0001, now + decay);
        src.connect(hp);
        hp.connect(g);
        g.connect(masterGain);
        src.start(now);
        src.stop(now + decay + 0.02);
      }

      function playShootSound() {
        // Short, bright dual-pulse zap closer to classic arcade cadence.
        playTone(1040, 'square', 0.001, 0.05, 0.07, 760);
        playTone(1680, 'square', 0.001, 0.028, 0.04, 1200);
        playTone(620, 'triangle', 0.001, 0.055, 0.026, 450);
      }

      function playHitSound() {
        playTone(430, 'sawtooth', 0.001, 0.07, 0.045, 220);
      }

      function playExplosionSound(level = 0.14) {
        playNoise(0.18, Math.max(0.01, Math.min(0.09, level)));
        playTone(180, 'triangle', 0.001, 0.14, 0.05, 60);
      }

      function playCaptureSound() {
        playTone(520, 'square', 0.001, 0.06, 0.032, 700);
        playTone(700, 'triangle', 0.001, 0.08, 0.026, 920);
      }

      function playDeliverySound() {
        if (!audioCtx || !masterGain) return;
        const now = audioCtx.currentTime;
        const notes = [392, 523.25, 659.25, 783.99];
        for (let i = 0; i < notes.length; i++) {
          const t = now + i * 0.075;
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = i % 2 === 0 ? 'triangle' : 'square';
          osc.frequency.setValueAtTime(notes[i], t);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.045, t + 0.008);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
          osc.connect(g);
          g.connect(masterGain);
          osc.start(t);
          osc.stop(t + 0.18);
        }
      }

      function updateMusic() {
        if (!audioCtx || !masterGain || gameState !== 'playing') return;
        const now = audioCtx.currentTime;
        const intensity = Math.min(1.8, enemies.length / 10 + (activeChallenge ? 0.5 : 0));
        const bpm = 128 + intensity * 34;
        const stepDur = 60 / bpm / 2;
        while (musicNextTime < now + 0.22) {
          const s = musicStep % 16;
          if (s % 4 === 0) {
            const bass = [98, 98, 110, 123][Math.floor(s / 4)];
            playToneAt(bass, 'triangle', musicNextTime, 0.001, stepDur * 0.9, 0.026 + intensity * 0.010, bass * 0.98);
          }
          if (s % 2 === 0) {
            const seq = [392, 440, 523.25, 587.33, 659.25, 587.33, 523.25, 440];
            const n = seq[(musicStep / 2) % seq.length];
            playToneAt(n, 'square', musicNextTime, 0.001, stepDur * 0.55, 0.017 + intensity * 0.008, n * 0.98);
          }
          if (s === 4 || s === 12) {
            playNoiseAt(musicNextTime, stepDur * 0.4, 0.012 + intensity * 0.004);
          }
          musicNextTime += stepDur;
          musicStep++;
        }
      }

      function playToneAt(freq, type, t0, attack, decay, gainAmt, glide = null) {
        if (!audioCtx || !masterGain) return;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t0);
        if (glide) osc.frequency.exponentialRampToValueAtTime(Math.max(35, glide), t0 + decay);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(gainAmt, t0 + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + decay);
        osc.connect(g);
        g.connect(masterGain);
        osc.start(t0);
        osc.stop(t0 + decay + 0.03);
      }

      function playNoiseAt(t0, decay, gainAmt) {
        if (!audioCtx || !masterGain || !noiseBuffer) return;
        const src = audioCtx.createBufferSource();
        src.buffer = noiseBuffer;
        const bp = audioCtx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = 1450;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(gainAmt, t0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + decay);
        src.connect(bp);
        bp.connect(g);
        g.connect(masterGain);
        src.start(t0);
        src.stop(t0 + decay + 0.02);
      }

      function updateAudio() {
        if (!audioCtx || !masterGain) return;
        updateMusic();
        if (player.beam && !beamOsc) {
          const now = audioCtx.currentTime;
          beamOsc = audioCtx.createOscillator();
          beamGain = audioCtx.createGain();
          beamOsc.type = 'sawtooth';
          beamOsc.frequency.setValueAtTime(118, now);
          beamGain.gain.setValueAtTime(0.0001, now);
          beamGain.gain.exponentialRampToValueAtTime(0.028, now + 0.03);
          beamOsc.connect(beamGain);
          beamGain.connect(masterGain);
          beamOsc.start(now);
        } else if (!player.beam && beamOsc) {
          const now = audioCtx.currentTime;
          beamGain.gain.cancelScheduledValues(now);
          beamGain.gain.setValueAtTime(Math.max(0.0001, beamGain.gain.value), now);
          beamGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
          beamOsc.stop(now + 0.06);
          beamOsc = null;
          beamGain = null;
        }

        if (beamOsc && beamGain) {
          const now = audioCtx.currentTime;
          const mod = 104 + Math.abs(player.vy) * 0.15 + (Math.sin(performance.now() * 0.02) * 7 + 7);
          beamOsc.frequency.setTargetAtTime(mod, now, 0.03);
        }
      }

      function buildTerrain() {
        const pts = [];
        const samples = 512;
        for (let i = 0; i < samples; i++) {
          const x = i / (samples - 1);
          const y = GROUND_BASE
            + Math.sin(x * Math.PI * 4.7) * 18
            + Math.sin(x * Math.PI * 13.3 + 1.1) * 9
            + Math.cos(x * Math.PI * 2.1 + 0.4) * 14;
          pts.push(y);
        }
        return pts;
      }

      function groundYAt(wx) {
        const x = wrapX(wx) / WORLD_W;
        const idx = x * (terrain.length - 1);
        const i0 = Math.floor(idx);
        const i1 = (i0 + 1) % terrain.length;
        const t = idx - i0;
        return terrain[i0] * (1 - t) + terrain[i1] * t;
      }

      function worldToScreenX(wx, parallax = 1) {
        const cx = wrapDelta(wx - camX * parallax);
        return cx + W * 0.5;
      }

      function screenToWorldX(sx, parallax = 1) {
        return wrapX((sx - W * 0.5) + camX * parallax);
      }

      function wrapX(x) {
        x %= WORLD_W;
        if (x < 0) x += WORLD_W;
        return x;
      }

      function wrapDelta(dx) {
        dx = ((dx + WORLD_W * 0.5) % WORLD_W + WORLD_W) % WORLD_W - WORLD_W * 0.5;
        return dx;
      }

      function lerpAngleLike(a, b, t) {
        return a + wrapDelta(b - a) * t;
      }

      function randRange(a, b) {
        return a + Math.random() * (b - a);
      }

      function randomFarX(center, minDist) {
        for (let i = 0; i < 18; i++) {
          const x = randRange(0, WORLD_W);
          if (Math.abs(wrapDelta(x - center)) >= minDist) return x;
        }
        return wrapX(center + (Math.random() < 0.5 ? -1 : 1) * minDist);
      }

      function roundTargetRescues() {
        const m = currentMission || missions[selectedMissionId];
        if (!m) return 0;
        if (m.winMode === 'training') return m.targetRescues || 0;
        const runGoal = m.runGoal || m.targetRescues || 0;
        return Math.ceil((runGoal * campaignRound) / 3);
      }

      function runGoalForMission() {
        const m = currentMission || missions[selectedMissionId];
        if (!m) return 0;
        if (m.winMode === 'training') return m.targetRescues || 0;
        return m.runGoal || m.targetRescues || 0;
      }

      function activeAbductorCount() {
        let count = 0;
        for (const e of enemies) {
          if (e.type === 'lander' && (e.state === 'abduct' || e.state === 'ascend')) count++;
        }
        return count;
      }

      function maxConcurrentAbductors() {
        if (!currentMission || currentMission.id === 'practice') return 1;
        if (currentMission.id === 'standard') return 1;
        return campaignRound >= 3 ? 3 : 2;
      }

      function pickRivalFaction() {
        return rivalFactions[Math.floor(Math.random() * rivalFactions.length)];
      }

      function roundEnemyScale() {
        return 1 + (campaignRound - 1) * 0.1;
      }

      function roundFireScale() {
        return 1 + (campaignRound - 1) * 0.12;
      }

      function roundSpawnChance() {
        return currentMission.spawnChance * (1 + (campaignRound - 1) * 0.2);
      }

      function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
      }

      function makeStars(n, driftFactor, maxSize) {
        const stars = [];
        for (let i = 0; i < n; i++) {
          stars.push({
            x: Math.random() * WORLD_W,
            y: Math.random() * (H - 120),
            size: Math.max(1, Math.random() * maxSize),
            t: Math.random() * Math.PI * 2,
            d: driftFactor,
          });
        }
        return stars;
      }

      // subtle star drift to keep sky alive
      setInterval(() => {
        for (const s of starsFar) s.x = wrapX(s.x + s.d * 0.8);
        for (const s of starsMid) s.x = wrapX(s.x + s.d * 1.2);
        for (const s of starsNear) s.x = wrapX(s.x + s.d * 1.8);
      }, 33);
    })();
  </script>
</body>
